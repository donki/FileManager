<?xml version="1.0" encoding="UTF-8"?>
<!-- Primer plano del icono: carpeta blanca sólida con un documento asomando. Glifo
     grande y de alto contraste sobre el azul de marca. -->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">

  <!-- Documento que asoma por detrás de la carpeta -->
  <g>
    <path d="M182 120 h72 l40 40 v70 h-112 Z" fill="#FDBA74" />
    <path d="M254 120 l40 40 h-40 Z" fill="#E67E22" />
    <rect x="200" y="158" width="72" height="9" rx="4.5" fill="#E67E22" opacity="0.85" />
    <rect x="200" y="180" width="72" height="9" rx="4.5" fill="#E67E22" opacity="0.85" />
    <rect x="200" y="202" width="48" height="9" rx="4.5" fill="#E67E22" opacity="0.85" />
  </g>

  <!-- Carpeta blanca sólida (pestaña + cuerpo) -->
  <path d="M74 196
           a26 26 0 0 1 26 -26
           h84
           a26 26 0 0 1 18.4 7.6
           l22.6 22.6
           H356
           a26 26 0 0 1 26 26
           v96
           a26 26 0 0 1 -26 26
           H100
           a26 26 0 0 1 -26 -26
           Z" fill="#FFFFFF" />

  <!-- Frente de la carpeta (tono para dar profundidad) -->
  <path d="M74 236 h308 v82 a26 26 0 0 1 -26 26 H100 a26 26 0 0 1 -26 -26 Z"
        fill="#DCE7F2" />

</svg>
